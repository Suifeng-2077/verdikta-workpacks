<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mobile frame — 390px evaluation</title>
<style>
  html, body { margin: 0; padding: 0; background: #12100e; }
  .frame { width: 390px; height: 2600px; border: 0; margin: 0 auto; display: block; }
  .shell { width: 420px; margin: 0 auto; }
</style>
</head>
<body>
  <!-- Render harness only. An iframe gives the page a true 390px containing
       block, which a headless capture of the page itself does not. -->
  <div class="shell"><iframe class="frame" src="index.html" title="mobile 390"></iframe></div>
</body>
</html>
